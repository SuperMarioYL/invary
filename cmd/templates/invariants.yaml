# Invary invariant set — the contracts every tool-call must honor.
#
# This file documents the invariant DSL. 'invary init' (milestone m3) writes a
# copy into your project so you can customize the contract set; 'invary check'
# (milestone m1) always runs the built-in four below, with no config file
# required for the happy path. Custom invariant loading is a v0.2+ feature.
#
# Each invariant has:
#   id        — canonical name (one of the built-ins, or a future custom id)
#   severity  — "error" (hard contract violation) | "warn" (advisory drift)
#   spec      — per-check parameters (free-form; reserved for custom invariants)

version: 1
invariants:
  - id: valid_json
    severity: error
    spec:
      description: tool_call.arguments parses as a JSON object
  - id: required_fields
    severity: error
    spec:
      description: all schema-declared required fields are present in arguments
  - id: arg_types
    severity: error
    spec:
      description: each argument value matches its schema-declared type
  - id: no_schema_drift
    severity: warn
    spec:
      description: no argument key exists that the schema does not declare
