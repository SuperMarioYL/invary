name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # goreleaser hard-fails (422 already_exists) when the release already
      # carries assets with the same names — e.g. a re-run, or a publishing
      # flow that creates the release before the tagged workflow uploads.
      # Clear stale assets so the upload is idempotent.
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null |
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release delete-asset "${GITHUB_REF_NAME}" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
